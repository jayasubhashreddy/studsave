services:
  - type: web
    name: studsave
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      cd frontend && npm install && npm run build
      cp -r frontend/dist/* backend/public/
    startCommand: cd backend && npm install && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        value: ""
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
